  <style>
    :root { --purple:#6600FF; --green:#47d45a; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body {
      font-family:"Noto Sans Devanagari",system-ui,sans-serif;
      background:#fff; color:#211a30;
      display:grid; place-items:center;
      padding:24px;
    }
    main {
      width:min(100%, 620px); min-height:calc(100vh - 48px);
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; text-align:center;
    }
    .logo {
      display:block; width:min(100%, 390px); height:auto;
      object-fit:contain; margin-bottom:2px;
    }
    .tagline {
      margin:0 0 20px; font-size:clamp(15px,2.5vw,19px);
      font-weight:500; letter-spacing:.01em; color:#514b5d;
    }
    h1 {
      margin:0; color:var(--purple);
      font-size:clamp(27px,5vw,40px); line-height:1.35; font-weight:700;
    }
    .email {
      margin-top:26px; font-size:16px; color:#55505f;
      text-decoration:none; border:0; padding-bottom:0;
    }
    .email:hover { color:var(--purple); }
    @media (max-width:480px) {
      main { min-height:calc(100svh - 48px); }
      .logo { width:min(100%, 330px); }
      .tagline { margin-top:0; margin-bottom:18px; }
    }
  </style>
