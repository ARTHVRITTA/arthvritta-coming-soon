<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="अर्थवृत्त — मराठीतील विश्वासार्ह आर्थिक माहितीचे व्यासपीठ. लवकरच येत आहे.">
  <title>अर्थवृत्त | लवकरच येत आहे</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --purple:#6600FF; --green:#47d45a; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body {
      font-family:"Noto Sans Devanagari",system-ui,sans-serif;
      background:#fff; color:#211a30;
      display:grid; place-items:center;
      padding:24px;
    }
    main {
      width:min(100%, 620px); min-height:calc(100vh - 48px);
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; text-align:center;
    }
    .logo {
      display:block; width:min(100%, 390px); height:auto;
      object-fit:contain; margin-bottom:2px;
    }
    .wordmark {
      margin:8px 0 12px; color:#000000;
      font-family:"Noto Sans Devanagari",system-ui,sans-serif; font-size:clamp(20px,3vw,25px);
      font-weight:700; letter-spacing:.02em; line-height:1.2;
    }
    .wordmark sup { color:#000; font-size:.55em; vertical-align:super; margin-left:1px; }
    .tagline {
      margin:0 0 20px; font-size:clamp(15px,2.5vw,19px);
      font-weight:700; letter-spacing:.01em; color:#514b5d;
    }
    h1 {
      margin:0; color:var(--purple);
      font-size:clamp(27px,5vw,40px); line-height:1.35; font-weight:700;
    }
    .email {
      margin-top:26px; font-size:16px; color:#55505f;
      text-decoration:none; border:0; padding-bottom:0;
    }
    .email:hover { color:var(--purple); }
    @media (max-width:480px) {
      main { min-height:calc(100svh - 48px); }
      .logo { width:min(100%, 330px); }
      .tagline { margin-top:0; margin-bottom:18px; }
    }
  </style>
